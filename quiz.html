<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영문법 실전 암기 퀴즈</title>
    <style>
        /* CSS: 디자인 영역 */
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .quiz-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; width: 100%; }
        h2 { color: #333; font-size: 1.2em; line-height: 1.5; margin-bottom: 20px; }
        .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #eef2f5; border: none; border-radius: 8px; text-align: left; font-size: 1em; cursor: pointer; transition: 0.2s; }
        .option-btn:hover { background: #dce4e8; }
        .option-btn.correct { background: #4caf50; color: white; }
        .option-btn.wrong { background: #f44336; color: white; }
        #explanation-box { margin-top: 20px; padding: 15px; background: #fff3cd; border-left: 5px solid #ffc107; border-radius: 5px; display: none; white-space: pre-wrap; line-height: 1.5;}
        #next-btn { display: none; margin-top: 20px; width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 1.1em; cursor: pointer; font-weight: bold;}
        #next-btn:hover { background: #0056b3; }
        #status-text { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="status-text">총 <span id="total-q">0</span>문제 대기 중</div>
    <h2 id="question-text">문제를 불러오는 중...</h2>
    
    <div id="options-container"></div>

    <div id="explanation-box"></div>
    <button id="next-btn" onclick="loadNextQuestion()">다음 문제 풀기 ➔</button>
</div>

<script src="quiz_data.js"></script>

<script>
    // JS: 동작 로직 영역
    let currentAnswer = "";
    let currentExplanation = "";

    function loadNextQuestion() {
        // UI 초기화
        document.getElementById("options-container").innerHTML = "";
        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        
        // 데이터가 없는 경우 방어 코드
        if (typeof quizData === 'undefined' || quizData.length === 0) {
            document.getElementById("question-text").innerText = "데이터(quiz_data.js)를 불러오지 못했습니다.";
            return;
        }

        document.getElementById("total-q").innerText = quizData.length;

        // 랜덤으로 한 문제 뽑기
        const randomIndex = Math.floor(Math.random() * quizData.length);
        const data = quizData[randomIndex];

        currentAnswer = data.answer;
        currentExplanation = data.explanation;
        
        document.getElementById("question-text").innerText = data.question;

        // 옵션 버튼 4개 생성
        const optionsContainer = document.getElementById("options-container");
        for (let i = 1; i <= 4; i++) {
            if(data.options[i]){
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = data.options[i];
                btn.onclick = () => checkAnswer(i.toString(), btn);
                optionsContainer.appendChild(btn);
            }
        }
    }

    // 정답 체크 함수
    function checkAnswer(selectedChoice, btnElement) {
        // 모든 버튼 비활성화 (중복 클릭 방지)
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const explanationBox = document.getElementById("explanation-box");
        const nextBtn = document.getElementById("next-btn");

        if (selectedChoice === currentAnswer) {
            btnElement.classList.add("correct");
            explanationBox.innerHTML = "<strong>⭕ 정답입니다!</strong><br><br>" + currentExplanation;
        } else {
            btnElement.classList.add("wrong");
            // 정답인 버튼을 찾아서 초록색으로 표시 (배열은 0부터 시작하므로 -1)
            allBtns[parseInt(currentAnswer) - 1].classList.add("correct");
            explanationBox.innerHTML = "<strong>❌ 오답입니다.</strong><br><br>" + currentExplanation;
        }

        explanationBox.style.display = "block";
        nextBtn.style.display = "block";
    }

    // 창이 켜지자마자 첫 문제 실행
    window.onload = loadNextQuestion;
</script>

</body>
</html>
